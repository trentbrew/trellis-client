<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trellis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: white;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status {
      font-size: 13px;
      color: #737373;
    }
    .error {
      color: #ef4444;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">T</div>
    <h1>Trellis</h1>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Starting server...</p>
    <p class="error" id="error"></p>
  </div>
  <script>
    // Listen for Tauri events from the Rust side
    if (window.__TAURI__) {
      const { listen } = window.__TAURI__.event;

      listen('sidecar-error', (event) => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        const el = document.getElementById('error');
        el.style.display = 'block';
        el.textContent = 'Failed to start: ' + event.payload;
      });

      listen('sidecar-exit', (event) => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        const el = document.getElementById('error');
        el.style.display = 'block';
        el.textContent = 'Server process exited unexpectedly (code: ' + event.payload + ')';
      });
    }
  </script>
</body>
</html>
