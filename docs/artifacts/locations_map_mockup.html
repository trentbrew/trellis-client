<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trellis — Locations Map (TRL-LOC design mock)</title>
  <style>
    /* Tokens mirror docs/artifacts/locations_map_design.md */
    :root {
      --background: #0a0a0c;
      --surface: #141418;
      --surface-glass: rgba(20, 20, 24, 0.92);
      --text: #e8e8ec;
      --text-muted: #888894;
      --primary: #e85d4c;
      --primary-muted: rgba(232, 93, 76, 0.18);
      --pin-event: #fb923c;
      --pin-trip: #60a5fa;
      --pin-appointment: #34d399;
      --border: #2a2a32;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 13px;
      background: var(--background);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── App chrome ── */
    .header {
      height: 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .header-omnibox {
      flex: 1;
      max-width: 420px;
      margin: 0 auto;
      height: 32px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .shell {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Left rail */
    .rail-left {
      width: 64px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      gap: 6px;
      flex-shrink: 0;
    }
    .rail-left-cluster {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
    }
    .rail-icon {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s;
    }
    .rail-icon:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .rail-icon.active {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }
    .rail-spacer { flex: 1; }

    /* Main map area */
    .map-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0d1117;
    }

    /* Fake map tiles */
    .map-canvas {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 70% at 50% 45%, #1a2332 0%, #0d1117 70%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px);
    }
    .map-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(10,10,12,0.55) 100%);
      pointer-events: none;
    }

    /* Filter panel */
    .filter-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: var(--surface-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px;
      backdrop-filter: blur(12px);
      min-width: 200px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    .filter-panel[data-design-note="top-left floating — matches Graph layout toggle"] {}
    .filter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .filter-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .filter-count {
      font-size: 10px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 9999px;
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .chip.on {
      background: var(--primary-muted);
      border-color: color-mix(in oklch, var(--primary) 40%, var(--border));
      color: var(--text);
    }
    .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .list-toggle {
      margin-top: 10px;
      width: 100%;
      padding: 6px;
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
    }
    .list-toggle:hover { color: var(--text); border-color: var(--text-muted); }

    /* Pins */
    .pin {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.15s, box-shadow 0.15s;
      z-index: 5;
      font-size: 12px;
    }
    .pin:hover, .pin.selected {
      transform: translate(-50%, -50%) scale(1.12);
      z-index: 6;
    }
    .pin.selected {
      box-shadow: 0 0 0 2px var(--primary);
    }
    .pin.hidden { display: none; }

    /* Preview card */
    .preview {
      position: absolute;
      width: 288px;
      background: var(--surface-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s, transform 0.12s;
    }
    .preview.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .preview[data-design-note="appears ABOVE pin — 8px gap"] {}
    .preview-body { padding: 12px; }
    .preview-type {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .preview-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .preview-meta {
      font-size: 10px;
      text-transform: capitalize;
      color: var(--text-muted);
    }
    .preview-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .preview-snippet {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview-footer {
      border-top: 1px solid rgba(42,42,50,0.6);
      padding: 8px 12px;
      font-size: 10px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.02);
    }

    /* Zoom controls */
    .zoom-cluster {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--surface-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      backdrop-filter: blur(12px);
    }
    .zoom-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 12px;
      z-index: 10;
      font-size: 10px;
      color: var(--text-muted);
      background: var(--surface-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      backdrop-filter: blur(8px);
      max-width: 220px;
    }
    .legend strong { color: var(--primary); }

    /* Mobile bottom rail hint */
    @media (max-width: 768px) {
      .rail-left { display: none; }
      .bottom-rail { display: flex; }
      .filter-panel { top: auto; bottom: 72px; left: 8px; right: 8px; }
    }
    .bottom-rail {
      display: none;
      height: 48px;
      border-top: 1px solid var(--border);
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .bottom-rail .rail-icon.active {
      width: auto;
      padding: 0 14px;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="header">
    <span style="font-size:12px;color:var(--text-muted)">Workspace</span>
    <div class="header-omnibox">Search or ask anything…</div>
  </header>

  <div class="shell">
    <nav class="rail-left" aria-label="Navigation rail">
      <div class="rail-left-cluster" data-design-note="Graph + Chat left cluster">
        <div class="rail-icon" title="Graph">🧠</div>
        <div class="rail-icon" title="Chat">🤖</div>
      </div>
      <div class="rail-spacer"></div>
      <div class="rail-left-cluster" data-design-note="Center primary — Locations lives here in production rail config">
        <div class="rail-icon" title="Collections">📚</div>
        <div class="rail-icon active" title="Locations">📍</div>
        <div class="rail-icon" title="Calendar">📅</div>
      </div>
    </nav>

    <main class="map-stage" id="mapStage">
      <div class="map-canvas"></div>
      <div class="map-vignette"></div>

      <!-- Filter panel -->
      <div class="filter-panel" data-design-note="top-left floating — matches Graph layout toggle">
        <div class="filter-header">
          <span class="filter-label">Entity types</span>
          <span class="filter-count" id="pinCount">5 places</span>
        </div>
        <div class="filter-chips" id="filterChips">
          <button class="chip on" data-type="event"><span class="chip-dot" style="background:var(--pin-event)"></span>Events</button>
          <button class="chip on" data-type="trip"><span class="chip-dot" style="background:var(--pin-trip)"></span>Trips</button>
          <button class="chip on" data-type="appointment"><span class="chip-dot" style="background:var(--pin-appointment)"></span>Appointments</button>
        </div>
        <button class="list-toggle" id="listToggle">☰ List view (a11y)</button>
      </div>

      <!-- Pins (percent positions on fake map) -->
      <div class="pin" data-id="1" data-type="event" style="left:38%;top:42%;background:var(--pin-event)" title="Team offsite">📅</div>
      <div class="pin" data-id="2" data-type="event" style="left:52%;top:35%;background:var(--pin-event)">📅</div>
      <div class="pin" data-id="3" data-type="trip" style="left:28%;top:58%;background:var(--pin-trip)">✈️</div>
      <div class="pin" data-id="4" data-type="trip" style="left:62%;top:55%;background:var(--pin-trip)">✈️</div>
      <div class="pin" data-id="5" data-type="appointment" style="left:45%;top:62%;background:var(--pin-appointment)">🩺</div>

      <!-- Preview card (positioned by JS) -->
      <div class="preview" id="preview" data-design-note="appears ABOVE pin — 8px gap">
        <div class="preview-body">
          <div class="preview-type">
            <div class="preview-badge" id="previewBadge">📅</div>
            <div>
              <div class="preview-meta" id="previewMeta">Event</div>
            </div>
          </div>
          <div class="preview-title" id="previewTitle">Team offsite</div>
          <div class="preview-snippet" id="previewSnippet">Quarterly planning at Dogpatch Studio. Arrive 9am.</div>
        </div>
        <div class="preview-footer">Click to open</div>
      </div>

      <!-- Zoom -->
      <div class="zoom-cluster">
        <button class="zoom-btn" title="Zoom in">+</button>
        <button class="zoom-btn" title="Zoom out">−</button>
        <button class="zoom-btn" title="Fit all" style="font-size:11px">⊡</button>
        <button class="zoom-btn" title="Locate me" style="font-size:11px">◎</button>
      </div>

      <div class="legend">
        Design mock · <strong>TRL-LOC</strong> · hover pins · toggle filters
      </div>
    </main>
  </div>

  <nav class="bottom-rail" aria-label="Mobile navigation">
    <div class="rail-icon">🧠</div>
    <div class="rail-icon">🤖</div>
    <div class="rail-icon active">📍 Locations</div>
    <div class="rail-icon">📅</div>
  </nav>

  <script>
    const PINS = {
      1: { type: 'event', title: 'Team offsite', snippet: 'Quarterly planning at Dogpatch Studio. Arrive 9am.', emoji: '📅', color: 'var(--pin-event)' },
      2: { type: 'event', title: 'Investor dinner', snippet: 'SOMA · 7pm reservation', emoji: '📅', color: 'var(--pin-event)' },
      3: { type: 'trip', title: 'SF → NYC', snippet: 'Origin: SFO · Apr 14', emoji: '✈️', color: 'var(--pin-trip)' },
      4: { type: 'trip', title: 'Portland retreat', snippet: 'Destination: Timberline Lodge', emoji: '✈️', color: 'var(--pin-trip)' },
      5: { type: 'appointment', title: 'Annual checkup', snippet: 'UCSF Mission Bay · 2:30pm', emoji: '🩺', color: 'var(--pin-appointment)' },
    };

    const preview = document.getElementById('preview');
    const stage = document.getElementById('mapStage');
    let hideTimer = null;

    function showPreview(pinEl) {
      const id = pinEl.dataset.id;
      const data = PINS[id];
      if (!data) return;

      document.querySelectorAll('.pin').forEach(p => p.classList.remove('selected'));
      pinEl.classList.add('selected');

      document.getElementById('previewBadge').textContent = data.emoji;
      document.getElementById('previewBadge').style.background = data.color + '33';
      document.getElementById('previewMeta').textContent = data.type;
      document.getElementById('previewTitle').textContent = data.title;
      document.getElementById('previewSnippet').textContent = data.snippet;

      const rect = pinEl.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const left = rect.left - stageRect.left + rect.width / 2;
      const top = rect.top - stageRect.top - 8;

      preview.style.left = Math.max(12, Math.min(left - 144, stageRect.width - 300)) + 'px';
      preview.style.top = (top - preview.offsetHeight) + 'px';
      preview.classList.add('visible');
    }

    function hidePreview() {
      preview.classList.remove('visible');
      document.querySelectorAll('.pin').forEach(p => p.classList.remove('selected'));
    }

    document.querySelectorAll('.pin').forEach(pin => {
      pin.addEventListener('mouseenter', () => {
        clearTimeout(hideTimer);
        showPreview(pin);
      });
      pin.addEventListener('mouseleave', () => {
        hideTimer = setTimeout(hidePreview, 180);
      });
      pin.addEventListener('click', () => {
        alert('dialogStack.push("' + PINS[pin.dataset.id].title + '")');
      });
    });

    preview.addEventListener('mouseenter', () => clearTimeout(hideTimer));
    preview.addEventListener('mouseleave', () => { hideTimer = setTimeout(hidePreview, 180); });

    // Filter chips
    const chips = document.querySelectorAll('.chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('on');
        const type = chip.dataset.type;
        const on = chip.classList.contains('on');
        document.querySelectorAll('.pin[data-type="' + type + '"]').forEach(p => {
          p.classList.toggle('hidden', !on);
        });
        const visible = document.querySelectorAll('.pin:not(.hidden)').length;
        document.getElementById('pinCount').textContent = visible + ' place' + (visible === 1 ? '' : 's');
        hidePreview();
      });
    });

    document.getElementById('listToggle').addEventListener('click', () => {
      alert('List view panel — keyboard-accessible entity list (Architect AC)');
    });
  </script>
</body>
</html>
