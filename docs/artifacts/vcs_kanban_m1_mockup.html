<!DOCTYPE html>
<!-- trellis-design-adopted: slug=vcs_kanban_m1 baseline=vcs_kanban scope=M1-filters-swimlanes -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trellis — VCS Issue Kanban M1 (TRL-21 design mock)</title>
  <style>
    :root {
      --background: #0a0a0c;
      --surface: #141418;
      --surface-elevated: #1a1a20;
      --text: #e8e8ec;
      --text-muted: #888894;
      --primary: #6366f1;
      --border: #2a2a32;
      --filter-active: #6366f1;
      --filter-active-bg: rgba(99, 102, 241, 0.12);
      --swimlane-header: #16161c;
      --swimlane-border: #32323c;
      --status-backlog: #6b7280;
      --status-queue: #f59e0b;
      --status-in-progress: #10b981;
      --status-paused: #eab308;
      --status-closed: #52525b;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-pill: 9999px;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); font-size: 13px; background: var(--background);
      color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    @media (prefers-reduced-motion: reduce) {
      .swimlane-grid { transition: none !important; }
    }
    .design-legend {
      position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 300;
      font-size: 10px; color: var(--text-muted); background: rgba(0,0,0,0.9);
      border: 1px dashed var(--filter-active); border-radius: var(--radius-pill);
      padding: 3px 10px; pointer-events: none;
    }
    .lab-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 20px 0; gap: 16px; flex-shrink: 0; }
    .lab-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
    .sub-nav { display: flex; gap: 4px; margin-top: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); }
    .sub-nav a { padding: 8px 14px; font-size: 13px; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .sub-nav a.active { color: var(--text); border-bottom-color: var(--primary); }
    .workspace-badge { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; border-radius: var(--radius-pill); }

    .filter-bar {
      display: flex; align-items: center; gap: 8px; padding: 10px 20px;
      background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
    }
    .filter-wrap { position: relative; }
    .filter-chip {
      font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: var(--radius-pill);
      border: 1px solid var(--border); color: var(--text-muted); background: var(--surface);
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .filter-chip:hover { color: var(--text); border-color: color-mix(in oklch, var(--primary) 40%, var(--border)); }
    .filter-chip.active { color: var(--text); border-color: var(--filter-active); background: var(--filter-active-bg); }
    .filter-chip .badge { background: var(--primary); color: #fff; font-size: 9px; min-width: 16px; height: 16px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
    .filter-popover {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; min-width: 220px; max-height: 280px;
      overflow-y: auto; background: var(--surface-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      display: none;
    }
    .filter-popover.open { display: block; }
    .filter-popover label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12px; cursor: pointer; border-radius: var(--radius-sm); }
    .filter-popover label:hover { background: rgba(255,255,255,0.04); }
    .view-select {
      font-size: 11px; padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    .btn-text { font-size: 11px; background: none; border: none; color: var(--primary); cursor: pointer; padding: 4px 8px; }
    .btn-text:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-ghost { font-size: 11px; padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; }
    .filter-spacer { flex: 1; min-width: 8px; }
    .live-count { font-size: 11px; color: var(--text-muted); }
    .sync-note { font-size: 11px; color: var(--text-muted); }

    .board-wrap { flex: 1; overflow: auto; padding: 16px 20px 24px; }
    .filter-empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .filter-empty h2 { font-size: 14px; color: var(--text); margin-bottom: 8px; }

    .swimlane { margin-bottom: 20px; border: 1px solid var(--swimlane-border); border-radius: var(--radius-md); overflow: hidden; }
    .swimlane-header {
      display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 40px;
      background: var(--swimlane-header); border-bottom: 1px solid var(--swimlane-border);
      cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 3;
    }
    .swimlane-header button.chevron {
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    }
    .swimlane-header.collapsed button.chevron { transform: rotate(-90deg); }
    .epic-id { font-family: var(--font-mono); font-size: 11px; color: var(--primary); font-weight: 500; }
    .epic-title { font-size: 12px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .epic-meta { font-size: 11px; color: var(--text-muted); }
    .swimlane-grid { display: flex; gap: 12px; padding: 12px 14px 14px; overflow-x: auto; }
    .swimlane-grid.collapsed { display: none; }

    .flat-board { display: flex; gap: 12px; overflow-x: auto; }
    .column { flex: 0 0 260px; display: flex; flex-direction: column; gap: 8px; }
    .column-header { display: flex; align-items: center; gap: 8px; padding: 6px 4px; }
    .column-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .column-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; flex: 1; }
    .column-count { font-size: 11px; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
    .column-body { display: flex; flex-direction: column; gap: 8px; min-height: 48px; }
    .column-empty { border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 16px 8px; text-align: center; font-size: 11px; color: var(--text-muted); }

    .card {
      background: rgba(20, 20, 24, 0.6); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 12px; cursor: pointer; text-align: left; width: 100%; color: inherit; font: inherit;
    }
    .card:hover { border-color: color-mix(in oklch, var(--primary) 35%, var(--border)); }
    .card.closed { opacity: 0.75; }
    .card-id { font-family: var(--font-mono); font-size: 11px; color: var(--primary); font-weight: 500; }
    .card-title { font-size: 13px; font-weight: 500; line-height: 1.35; margin: 6px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .label { font-size: 10px; padding: 0 6px; height: 20px; display: inline-flex; align-items: center; border-radius: var(--radius-sm); font-weight: 500; background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .card-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
    .parent-ref { font-family: var(--font-mono); font-size: 10px; }
  </style>
</head>
<body>
  <div class="design-legend">TRL-21 M1 mock · filters + epic swimlanes · read-only</div>

  <header class="lab-header">
    <div>
      <div class="lab-title">🧪 Lab</div>
      <nav class="sub-nav" data-design-note="Unchanged M0 sub-nav">
        <a href="#">Op log</a>
        <a href="#" class="active">Issues</a>
      </nav>
    </div>
    <span class="workspace-badge">trellis-client</span>
  </header>

  <div class="filter-bar" data-design-note="M1: active filter chips + view mode">
    <div class="filter-wrap">
      <button type="button" class="filter-chip" id="labels-trigger" aria-haspopup="dialog" aria-expanded="false">Labels ▾</button>
      <div class="filter-popover" id="labels-popover" role="dialog" aria-label="Filter by label">
        <label><input type="checkbox" value="proposal" /> proposal</label>
        <label><input type="checkbox" value="design" /> design</label>
        <label><input type="checkbox" value="spec" /> spec</label>
        <label><input type="checkbox" value="impl" /> impl</label>
        <label><input type="checkbox" value="review" /> review</label>
        <label><input type="checkbox" value="needs-design" /> needs-design</label>
      </div>
    </div>
    <div class="filter-wrap">
      <button type="button" class="filter-chip" id="assignee-trigger" aria-haspopup="dialog" aria-expanded="false">Assignee ▾</button>
      <div class="filter-popover" id="assignee-popover" role="dialog" aria-label="Filter by assignee">
        <label><input type="checkbox" value="agent:trentbrew" /> agent:trentbrew</label>
        <label><input type="checkbox" value="__unassigned__" /> Unassigned</label>
      </div>
    </div>
    <select class="view-select" id="view-mode" aria-label="Board layout">
      <option value="grouped">Grouped by epic</option>
      <option value="flat">Flat</option>
    </select>
    <button type="button" class="btn-text" id="clear-filters" disabled>Clear</button>
    <span class="filter-spacer"></span>
    <span class="live-count" id="live-count" aria-live="polite">Showing 6 of 6</span>
    <button type="button" class="btn-ghost">↻ Refresh</button>
    <span class="sync-note">Last sync 12s ago</span>
  </div>

  <div class="board-wrap" id="board-root"></div>

  <script>
    const STATUSES = [
      { key: 'backlog', label: 'Backlog', color: 'var(--status-backlog)' },
      { key: 'queue', label: 'Queue', color: 'var(--status-queue)' },
      { key: 'in_progress', label: 'In progress', color: 'var(--status-in-progress)' },
      { key: 'paused', label: 'Paused', color: 'var(--status-paused)' },
      { key: 'closed', label: 'Done', color: 'var(--status-closed)' },
    ];

    const ISSUES = [
      { id: 'TRL-1', title: 'Open source', status: 'backlog', labels: ['proposal'], assignee: null, parent: null },
      { id: 'TRL-15', title: 'Proposal: VCS issue kanban (Lab board)', status: 'closed', labels: ['proposal', 'needs-design'], assignee: 'agent:trentbrew', parent: null },
      { id: 'TRL-16', title: 'Design: VCS issue kanban (Lab board)', status: 'closed', labels: ['design'], assignee: 'agent:trentbrew', parent: 'TRL-15' },
      { id: 'TRL-17', title: 'Spec: VCS issue kanban M0', status: 'closed', labels: ['spec', 'needs-e2e'], assignee: 'agent:trentbrew', parent: 'TRL-16' },
      { id: 'TRL-18', title: 'Impl: VCS issue kanban M0', status: 'closed', labels: ['impl'], assignee: 'agent:trentbrew', parent: 'TRL-17' },
      { id: 'TRL-21', title: 'Proposal: VCS kanban M1 (filters)', status: 'queue', labels: ['proposal', 'needs-design'], assignee: 'agent:trentbrew', parent: 'TRL-15' },
    ];

    const collapsed = new Set();
    let selectedLabels = new Set();
    let selectedAssignees = new Set();

    function issueMatches(issue) {
      if (selectedLabels.size) {
        if (!issue.labels.some(l => selectedLabels.has(l))) return false;
      }
      if (selectedAssignees.size) {
        const a = issue.assignee || '__unassigned__';
        if (!selectedAssignees.has(a)) return false;
      }
      return true;
    }

    function renderCard(issue) {
      const closed = issue.status === 'closed' ? ' closed' : '';
      const labels = issue.labels.map(l => `<span class="label">${l}</span>`).join('');
      const parent = issue.parent ? `<span class="parent-ref">← ${issue.parent}</span>` : '<span></span>';
      const assignee = issue.assignee ? issue.assignee.replace('agent:', '') : 'unassigned';
      return `<button type="button" class="card${closed}" aria-label="${issue.id}, ${issue.title}">
        <div class="card-id">${issue.id}</div>
        <div class="card-title">${issue.title}</div>
        <div class="labels">${labels}</div>
        <div class="card-meta">${parent}<span>${assignee}</span></div>
      </button>`;
    }

    function renderColumn(status, issues, hideParentOnCard) {
      const filtered = issues.filter(i => i.status === status.key);
      const body = filtered.length
        ? filtered.map(i => renderCard(i)).join('')
        : '<div class="column-empty">—</div>';
      return `<div class="column" role="group" aria-label="${status.label}, ${filtered.length} issues">
        <div class="column-header">
          <span class="column-dot" style="background:${status.color}"></span>
          <span class="column-title">${status.label}</span>
          <span class="column-count">${filtered.length}</span>
        </div>
        <div class="column-body">${body}</div>
      </div>`;
    }

    function renderSwimlane(epicId, epicTitle, issues) {
      const visible = issues.filter(issueMatches);
      if (!visible.length) return '';
      const isCollapsed = collapsed.has(epicId);
      const cols = STATUSES.map(s => renderColumn(s, visible)).join('');
      return `<section class="swimlane" data-epic="${epicId}">
        <div class="swimlane-header${isCollapsed ? ' collapsed' : ''}" data-toggle="${epicId}">
          <button type="button" class="chevron" aria-label="Toggle ${epicId}">${isCollapsed ? '▶' : '▼'}</button>
          <span class="epic-id">${epicId}</span>
          <span class="epic-title">${epicTitle}</span>
          <span class="epic-meta">${visible.length} issues</span>
        </div>
        <div class="swimlane-grid${isCollapsed ? ' collapsed' : ''}" id="grid-${epicId}">${cols}</div>
      </section>`;
    }

    function renderBoard() {
      const root = document.getElementById('board-root');
      const viewMode = document.getElementById('view-mode').value;
      const filtered = ISSUES.filter(issueMatches);
      const total = ISSUES.length;
      document.getElementById('live-count').textContent = `Showing ${filtered.length} of ${total}`;

      if (!filtered.length) {
        root.innerHTML = `<div class="filter-empty"><h2>No issues match filters</h2><p>Try clearing filters or choosing different labels.</p><button type="button" class="btn-text" onclick="clearAllFilters()">Clear filters</button></div>`;
        return;
      }

      if (viewMode === 'flat') {
        const cols = STATUSES.map(s => renderColumn(s, filtered)).join('');
        root.innerHTML = `<div class="flat-board" role="region" aria-label="VCS issue board flat">${cols}</div>`;
        return;
      }

      const epicIds = [...new Set(filtered.filter(i => i.parent).map(i => i.parent))];
      const epicTitles = Object.fromEntries(ISSUES.map(i => [i.id, i.title]));
      let html = '';
      epicIds.forEach(epicId => {
        const children = filtered.filter(i => i.parent === epicId);
        html += renderSwimlane(epicId, epicTitles[epicId] || epicId, children);
      });
      const orphans = filtered.filter(i => !i.parent);
      if (orphans.length) html += renderSwimlane('ungrouped', 'Ungrouped', orphans);
      root.innerHTML = html;

      root.querySelectorAll('[data-toggle]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.toggle;
          if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
          renderBoard();
        });
      });
    }

    function updateFilterUI() {
      const labelsActive = selectedLabels.size > 0;
      const assigneeActive = selectedAssignees.size > 0;
      const lt = document.getElementById('labels-trigger');
      const at = document.getElementById('assignee-trigger');
      lt.classList.toggle('active', labelsActive);
      at.classList.toggle('active', assigneeActive);
      lt.innerHTML = labelsActive ? `Labels <span class="badge">${selectedLabels.size}</span>` : 'Labels ▾';
      at.innerHTML = assigneeActive ? `Assignee <span class="badge">${selectedAssignees.size}</span>` : 'Assignee ▾';
      document.getElementById('clear-filters').disabled = !(labelsActive || assigneeActive);
      renderBoard();
    }

    function clearAllFilters() {
      selectedLabels.clear();
      selectedAssignees.clear();
      document.querySelectorAll('.filter-popover input').forEach(i => { i.checked = false; });
      updateFilterUI();
    }

    function setupPopover(triggerId, popoverId, setFn) {
      const trigger = document.getElementById(triggerId);
      const popover = document.getElementById(popoverId);
      trigger.addEventListener('click', e => {
        e.stopPropagation();
        document.querySelectorAll('.filter-popover').forEach(p => { if (p !== popover) p.classList.remove('open'); });
        const open = popover.classList.toggle('open');
        trigger.setAttribute('aria-expanded', open);
      });
      popover.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', () => {
          setFn();
          updateFilterUI();
        });
      });
    }

    setupPopover('labels-trigger', 'labels-popover', () => {
      selectedLabels = new Set([...document.querySelectorAll('#labels-popover input:checked')].map(i => i.value));
    });
    setupPopover('assignee-trigger', 'assignee-popover', () => {
      selectedAssignees = new Set([...document.querySelectorAll('#assignee-popover input:checked')].map(i => i.value));
    });

    document.addEventListener('click', () => {
      document.querySelectorAll('.filter-popover').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.filter-chip').forEach(t => t.setAttribute('aria-expanded', 'false'));
    });
    document.getElementById('clear-filters').addEventListener('click', clearAllFilters);
    document.getElementById('view-mode').addEventListener('change', renderBoard);

    renderBoard();
  </script>
</body>
</html>
